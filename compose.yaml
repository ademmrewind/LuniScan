services:
  backend:
    build: ./backend
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      LUNISCAN_DATABASE_URL: sqlite:////data/luniscan.db
      LUNISCAN_APPROVED_SCOPE: '${LUNISCAN_APPROVED_SCOPE:-["127.0.0.1","::1"]}'
      LUNISCAN_APPROVED_SERVICE_PORT: "${LUNISCAN_APPROVED_SERVICE_PORT:-8443}"
      LUNISCAN_DISCOVERY_LIMIT: "${LUNISCAN_DISCOVERY_LIMIT:-4}"
    volumes:
      - luniscan-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 5s
  frontend:
    build: ./frontend
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      LUNISCAN_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  luniscan-data:
