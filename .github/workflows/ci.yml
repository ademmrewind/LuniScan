name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --locked --python 3.12
      - run: uv run --project backend --locked ruff check backend
      - run: uv run --project backend --locked python -m compileall -q backend/app backend/tests
      - run: uv run --project backend --locked pytest backend/tests
      - run: docker compose config --quiet
  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --locked --python 3.12
      - run: npm.cmd --prefix frontend ci
      - run: npm.cmd --prefix frontend run typecheck
      - run: npm.cmd --prefix frontend run build
      - run: npm.cmd --prefix frontend run test:e2e -- --preview
